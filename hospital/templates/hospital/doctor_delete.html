{% extends 'hospital/base.html' %}

{% block title %}
Delete Doctor
{% endblock %}

{% block content %}

<div class="delete-box">

    <h2>Delete Doctor</h2>

    <p>
        Are you sure you want to delete
        <b>{{ doctor.name }}</b>?
    </p>

    <form method="POST">

        {% csrf_token %}

        <button type="submit">
            Delete
        </button>

        <a href="{% url 'doctor_list' %}">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
